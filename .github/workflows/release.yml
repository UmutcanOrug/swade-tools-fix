name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Use Node.js for module checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify AoE workflows
        shell: bash
        run: node --test tests/*.test.cjs

      - name: Build Foundry module package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          manifest_version="$(node -p 'JSON.parse(require("fs").readFileSync("module.json", "utf8")).version')"
          test "$version" = "$manifest_version"
          package_dir="$RUNNER_TEMP/swade-tools-package"
          archive="swade-tools-${version}.zip"

          mkdir -p "$package_dir"
          git archive HEAD | tar -x -C "$package_dir"
          rm -rf "$package_dir/.github"
          (
            cd "$package_dir"
            zip -qr "$GITHUB_WORKSPACE/$archive" .
          )

          cp RELEASE-NOTES.md "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "swade-tools-${version}.zip" \
            "module.json#module.json" \
            --verify-tag \
            --title "SWADE Tools ${version}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
